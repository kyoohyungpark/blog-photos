<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>블로그 사진</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #0f0f0f;
    color: #eaeaea;
    padding-bottom: 90px;
  }
  header {
    padding: 28px 32px 12px;
    border-bottom: 1px solid #222;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  header p {
    margin-top: 6px;
    font-size: 13px;
    color: #888;
  }

  .category {
    padding: 32px 0 24px;
    border-bottom: 1px solid #1a1a1a;
  }
  .category-title {
    padding: 0 32px 16px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
  }
  .category-title .count {
    margin-left: 8px;
    font-size: 13px;
    color: #888;
    font-weight: 400;
  }

  .photo-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 8px 32px 24px;
  }

  .photo {
    width: 100%;
    max-width: 720px;
    cursor: pointer;
  }
  .photo img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    background: #222;
    display: block;
  }
  .photo .filename {
    margin-top: 10px;
    font-size: 12px;
    color: #888;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .taskbar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 72px;
    background: rgba(20, 20, 20, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 24px;
    z-index: 100;
  }
  .nav-btn {
    background: transparent;
    color: #ccc;
    border: 1px solid transparent;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    white-space: nowrap;
  }
  .nav-btn:hover {
    background: #2a2a2a;
    color: #fff;
  }
  .nav-btn.active {
    background: #0078d4;
    color: #fff;
  }

  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.95);
    z-index: 200;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 40px;
  }
  .lightbox.show { display: flex; }
  .lightbox img {
    max-width: 95%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 4px;
  }
  .lightbox .lb-info {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    color: #eee;
    font-size: 13px;
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 6px;
  }
  .lightbox .lb-close {
    position: absolute;
    top: 20px; right: 28px;
    color: #fff;
    font-size: 32px;
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <h1>블로그 사진</h1>
  <p>사진을 클릭하면 크게 볼 수 있어요. 새로고침할 때마다 순서가 랜덤으로 바뀝니다. 아래 작업표시줄에서 카테고리 이동.</p>
</header>

<div id="categories"></div>

<div class="taskbar" id="taskbar"></div>

<div class="lightbox" id="lightbox">
  <span class="lb-close">&times;</span>
  <img id="lb-img" src="" alt="">
  <div class="lb-info" id="lb-info"></div>

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const catContainer = document.getElementById("categories");
  const taskbar = document.getElementById("taskbar");

  CATEGORIES.forEach((cat, idx) => {
    const section = document.createElement("section");
    section.className = "category";
    section.id = "cat-" + cat.id;
    const shuffled = shuffle(cat.files);
    section.innerHTML = `
      <h2 class="category-title">${cat.name} <span class="count">(${shuffled.length}장)</span></h2>
      <div class="photo-row"></div>
    `;
    const row = section.querySelector(".photo-row");
    shuffled.forEach(name => {
      const card = document.createElement("div");
      card.className = "photo";
      const src = cat.base + encodeURIComponent(name);
      card.innerHTML = `
        <img src="${src}" alt="${name}" loading="lazy">
        <div class="filename">${name}</div>
      `;
      card.addEventListener("click", () => openLightbox(src, name));
      row.appendChild(card);
    });
    catContainer.appendChild(section);

    const btn = document.createElement("button");
    btn.className = "nav-btn" + (idx === 0 ? " active" : "");
    btn.textContent = cat.name;
    btn.dataset.target = "cat-" + cat.id;
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.target);
      if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      }
    });
    taskbar.appendChild(btn);
  });

  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lb-img");
  const lbInfo = document.getElementById("lb-info");
  function openLightbox(src, name) {
    lbImg.src = src;
    lbInfo.textContent = name;
    lightbox.classList.add("show");
  }
  lightbox.addEventListener("click", () => lightbox.classList.remove("show"));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") lightbox.classList.remove("show");
  });

  const sections = Array.from(document.querySelectorAll(".category"));
  window.addEventListener("scroll", () => {
    const y = window.scrollY + 100;
    let current = sections[0];
    for (const s of sections) {
      if (s.offsetTop <= y) current = s;
    }
    if (current) {
      document.querySelectorAll(".nav-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.target === current.id);
      });
    }
  });
</script>
